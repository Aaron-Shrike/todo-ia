name: CI

# Lint + unit run on every push/PR (Unit 0). Integration (Postgres/pgvector, `backend-integration`
# below) is wired as of the Unit 14 follow-up, against a GitHub Actions service container --
# NOT the full `docker compose up --build` stack, to avoid building the heavy torch + baked
# embedding-model image on every CI run; integration tests use `FakeEmbedder`/in-memory adapters
# for anything embedding-related, so a live Postgres + pgvector is the only extra dependency they
# need. `slow` (real embedding model) still has no CI job -- unchanged, no infra for it yet.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Import-linter boundary contracts
        run: lint-imports
      - name: Pytest (unit only)
        run: pytest -m "not integration and not slow" -q

  backend-integration:
    name: Backend (integration, live Postgres/pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      # Same image `docker-compose.yml`'s `db` service uses. Service containers don't run
      # compose's `infra/db/init.sql` init script, so `phrases_test` (the DB every
      # `tests/integration/*` fixture actually connects to) is created manually below instead.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: todo_ia
          POSTGRES_PASSWORD: todo_ia
          POSTGRES_DB: todo_ia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo_ia -d todo_ia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Already points at `phrases_test` -- every integration fixture derives this same DB name
      # from `DATABASE_URL` via `base.rpartition("/")[0] + "/phrases_test"`, which is a no-op
      # when the base URL already ends in `/phrases_test`.
      DATABASE_URL: postgresql+psycopg://todo_ia:todo_ia@localhost:5432/phrases_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Create phrases_test database
        # `psycopg` is already a core dependency (installed above), so this reuses it instead of
        # relying on a `psql` client binary being preinstalled on the runner image.
        run: |
          python - <<'PY'
          import psycopg

          conn = psycopg.connect(
              "postgresql://todo_ia:todo_ia@localhost:5432/todo_ia", autocommit=True
          )
          conn.execute("CREATE DATABASE phrases_test")
          conn.close()
          PY
      - name: Alembic upgrade head (fail-fast schema check)
        run: alembic upgrade head
      - name: Pytest (integration only)
        run: pytest -m integration -q

  frontend:
    name: Frontend (unit + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      # No ESLint ruleset is wired yet (openspec/config.yaml), so a focused
      # test guard lives here as a grep check instead of an eslint-plugin-
      # vitest rule: `test.only`/`describe.only`/`it.only` make the suite
      # exit green while silently skipping everything else. First frontend
      # test suite in this repo, with several more test-heavy units (11-13)
      # about to land on the same setup, so this guard exists from day one.
      - name: Check for focused tests (.only)
        run: |
          if grep -rEn "\b(describe|it|test)\.only\(" src --include="*.test.ts" --include="*.test.tsx"; then
            echo "::error::Focused test(s) found above — remove .only before merging, it silently skips the rest of the suite." >&2
            exit 1
          fi
      - name: Vitest
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Drift guard for the openapi-typescript-generated file (design.md:
      # "generated types/api.ts regenerated in CI; build fails on diff").
      # `make types` lives at the repo root, not apps/web, hence the override.
      - name: Regenerate generated types and check for drift
        working-directory: .
        run: |
          make types
          git diff --exit-code -- apps/web/src/types/api.ts
