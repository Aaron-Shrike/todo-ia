name: CI

# Lint + unit only for now (Unit 0). Integration (Postgres/pgvector via docker compose) and
# slow (real embedding model) suites are wired once their infrastructure lands (Unit 4, Unit 8).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Import-linter boundary contracts
        run: lint-imports
      - name: Pytest (unit only)
        run: pytest -m "not integration and not slow" -q

  frontend:
    name: Frontend (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Vitest
        run: npm test
