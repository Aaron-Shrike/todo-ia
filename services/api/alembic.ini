[alembic]
# Migrations live in services/api/migrations/ (raw SQL revisions, Unit 4).
# sqlalchemy.url is intentionally unset: env.py resolves it from DATABASE_URL
# or a pre-set Config value (see migrations/env.py) — a hardcoded URL here
# would silently win over both.
script_location = migrations
prepend_sys_path = .
path_separator = os
