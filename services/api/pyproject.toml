[project]
name = "todo-ia-api"
version = "0.1.0"
description = "Phrase validation API with semantic duplicate detection (FastAPI + pgvector)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: fast, isolated unit tests (no I/O)",
  "integration: tests requiring a real database (Postgres/pgvector via docker compose)",
  "contract: tests validating a published port contract shared across adapters",
  "slow: tests requiring the real embedding model (excluded from make test-unit)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["app"]
ignore_missing_imports = true
