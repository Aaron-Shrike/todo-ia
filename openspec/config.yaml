schema: spec-driven

context: |
  Project: todo-ia (greenfield, no application code yet). Planned stack, per docs/Reto-Tecnico-Fullstack-AI.md.
  Stack: React or Vue frontend; Python + FastAPI backend; PostgreSQL; Hugging Face embeddings (semantic duplicate detection).
  Architecture: clean, layered (UI, business, data, AI integration). REST API with consistent response/error shape.
  Testing: pytest (backend) and vitest (frontend), both planned and not yet installed. Strict TDD enabled.
  Style: English artifacts; conventional commits; env-var configuration; SQL migrations required.

strict_tdd: true

testing:
  status: installed   # scaffolded in Unit 0 (chore/pv-00-scaffold): pytest + vitest wired and green
  strict_tdd: true
  backend:
    runner: pytest
    command: "pytest"
    version: "9.1.1"   # detected in services/api/.venv during Unit 0
    coverage: "pytest-cov (installed, not yet wired into a coverage gate)"
    integration: "httpx / FastAPI TestClient (planned, lands with Unit 6+)"
    linter: "ruff (installed, 0.16.8)"
    type_checker: "mypy (installed, 2.3.1)"
    formatter: "ruff format (suggested)"
  frontend:
    runner: vitest
    command: "vitest run"
    version: "5.0.1"   # detected in apps/web/node_modules during Unit 0
    coverage: "vitest --coverage (planned)"
    integration: "@testing-library/* (planned, lands with Unit 10+)"
    linter: "eslint (installed, 10.11.0, no ruleset configured yet)"
    type_checker: "typescript (installed, 7.0.2)"
    formatter: "prettier (installed, 3.9.8)"
  e2e: none

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Define API contracts, acceptance cases, and edge cases before implementation
  design:
    - Document architecture decisions with rationale
    - Keep AI integration behind a port/interface so the embedding model is swappable and mockable
    - Similarity threshold MUST be configurable via environment variable
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Forecast against the 400-line review budget
  apply:
    - Follow existing code patterns
    - Write failing test first (RED-GREEN-REFACTOR)
    tdd: true
    test_command: "make test-unit"
  verify:
    test_command: "make test-unit"
    build_command: ""   # stays empty until Unit 10 (web build) / Unit 4 (docker build)
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
